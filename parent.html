<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Piano Academy | Parent Panel</title>
    <link rel="stylesheet" href="./parent-style.css?v=111">
</head>

<body class="parent-page">
    <main class="container">
        <header class="academy-header">
            <div class="piano-icon">🎹</div>
            <h1>Online Piano Academy</h1>
            <p>Parent Performance Evaluation</p>
        </header>

        <section class="card login-card" id="login-card">
            <h2>🔐 Parent Login</h2>

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="login-button" type="button">
                Unlock Panel
            </button>
        </section>

        <section
            class="card parent-panel"
            id="parent-panel"
            style="display: none;"
        >
            <h2>🎼 Performance Evaluation</h2>

            <h3>🎧 Performance Status</h3>

            <div class="button-group status-buttons">
                <button id="listening-button" type="button">
                    🎧 Listening
                </button>

                <button id="reviewing-button" type="button">
                    🔍 Reviewing
                </button>

                <button
                    id="complete-button"
                    type="button"
                    class="complete-button"
                >
                    ✅ Complete
                </button>
            </div>

            <hr>

            <label for="song-name">Song Name</label>

            <input
                id="song-name"
                type="text"
                placeholder="Enter song name"
                autocomplete="off"
            >

            <h3>⭐ Performance Quality</h3>

            <select id="performance">
                <option value="0">None</option>
                <option value="50">Excellent Performance (+50 XP)</option>
                <option value="35">Good Performance (+35 XP)</option>
                <option value="20">Practice Attempt (+20 XP)</option>
            </select>

            <h3>🔁 Song Repetition</h3>

            <select id="repetition">
                <option value="0">None</option>
                <option value="-10">Low Repetition (-10 XP)</option>
                <option value="-25">Medium Repetition (-25 XP)</option>
                <option value="-35">High Repetition (-35 XP)</option>
            </select>

            <h3>🎯 Difficulty</h3>

            <select id="difficulty">
                <option value="1">None ×1</option>
                <option value="1">Easy ×1</option>
                <option value="1.5">Medium ×1.5</option>
                <option value="2">Hard ×2</option>
                <option value="3">Master ×3</option>
            </select>

            <h3>🏆 Bonuses</h3>

            <div class="bonus-list">
                <label class="bonus-option">
                    <input type="checkbox" class="bonus" value="100">
                    <span>New Song Learned (+100 XP)</span>
                </label>

                <label class="bonus-option">
                    <input type="checkbox" class="bonus" value="150">
                    <span>Difficult Challenge (+150 XP)</span>
                </label>

                <label class="bonus-option">
                    <input type="checkbox" class="bonus" value="50">
                    <span>Personal Record (+50 XP)</span>
                </label>
            </div>

            <h3>🎹 Technical Evaluation</h3>

            <label for="rhythm">Rhythm</label>
            <select id="rhythm">
                <option value="0">None</option>
                <option value="10">Perfect Rhythm (+10 XP)</option>
                <option value="-5">Rhythm Problem (-5 XP)</option>
            </select>

            <label for="notes">Notes</label>
            <select id="notes">
                <option value="0">None</option>
                <option value="10">Accurate Notes (+10 XP)</option>
                <option value="-5">Wrong Notes (-5 XP)</option>
            </select>

            <label for="expression">Expression</label>
            <select id="expression">
                <option value="0">None</option>
                <option value="10">Excellent Expression (+10 XP)</option>
                <option value="-5">Needs Expression (-5 XP)</option>
            </select>

            <div class="evaluation-result">
                <h2>
                    Final XP:
                    <span id="final-xp">0</span>
                    XP
                </h2>

                <h2>
                    Reward:
                    <span id="reward">0</span>
                    تومان
                </h2>
            </div>

            <div class="button-group action-buttons">
                <button id="calculate-button" type="button">
                    Calculate XP
                </button>

                <button id="save-button" type="button">
                    Save Performance
                </button>
            </div>

            <p id="message" aria-live="polite"></p>
        </section>
    </main>

    <script type="module" src="./app.js?v=111"></script>
</body>
</html>
