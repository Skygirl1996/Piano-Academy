<!DOCTYPE html>

<html>

<head>

<title>
Parent Panel
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>
🔐 Parent Panel
</h1>



<div class="card">


<h3>
Enter Password
</h3>


<input 
id="password"
type="password"
>


<button onclick="login()">
Login
</button>


</div>





<div 
id="panel"
class="card"
style="display:none;"
>



<h2>
🎹 Review Kiamahr's Performance
</h2>



<button onclick="startListening()">

🎧 Listening

</button>


<br><br>



<button onclick="reviewing()">

🔍 Reviewing

</button>


<br><br>



<button onclick="approve()">

🎉 Approve Performance +50 XP

</button>



</div>


</div>





<script src="./app.js"></script>



<script>


function login(){


let password =
document.getElementById("password").value;



if(password === "1234"){


document.getElementById("panel")
.style.display="block";


}

else{

alert("Wrong password");

}


}





function startListening(){


changeStatus(
"🎧 Listening to your performance..."
);


}



function reviewing(){


changeStatus(
"🔍 Reviewing rhythm and accuracy..."
);


}




function approve(){


approveScore(50);


}



</script>



</body>

</html>
