<!DOCTYPE html>

<html>

<head>

<title>
Parent Panel
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>
🔐 Parent Panel
</h1>



<div class="card">


<h3>
Enter Password
</h3>


<input 
id="password"
type="password"
>


<button onclick="login()">
Login
</button>


</div>





<div 
id="panel"
class="card"
style="display:none;"
>



<h2>
🎹 Review Kiamahr's Performance
</h2>



<button onclick="startListening()">

🎧 Listening

</button>


<br><br>



<button onclick="reviewing()">

🔍 Reviewing

</button>


<br><br>



<button onclick="approve()">

🎉 Approve Performance +50 XP

</button>

<p id="admin-message" class="admin-message"></p>

</div>


</div>





<script type="module" src="./app.js?v=3"></script>



<script>


function login(){


let password =
document.getElementById("password").value;



if(password === "1234"){


document.getElementById("panel")
.style.display="block";


}

else{

alert("Wrong password");

}


}





async function startListening() {
    await window.changeStatus(
        "🎧 We are listening to your performance..."
    );
}


async function reviewing() {
    await window.changeStatus(
        "🔍 Your rhythm and accuracy are being reviewed..."
    );
}


async function approve() {
    await window.approveScore(50);
}



</script>



</body>

</html>
