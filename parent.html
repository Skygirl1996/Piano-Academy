<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Piano Academy | Parent Panel</title>

<link rel="stylesheet" href="./style.css?v=20">

</head>


<body>


<main class="container">


<header class="academy-header">

<div class="piano-icon">🎹</div>

<h1>Online Piano Academy</h1>

<p>Parent Performance Evaluation</p>

</header>



<section class="card login-card" id="login-card">


<h2>🔐 Parent Login</h2>


<input 
id="password"
type="password"
placeholder="Password"
>


<button 
id="login-button"
type="button"
>
Unlock Panel
</button>


</section>





<section 
class="card"
id="parent-panel"
style="display:none;"
>


<h2>🎼 Performance Evaluation</h2>



<label>
Song Name
</label>


<input 
id="song-name"
placeholder="Song name"
>



<h3>⭐ Performance Quality</h3>


<label>
<input type="radio" name="performance" value="50">
Excellent Performance (+50 XP)
</label>


<label>
<input type="radio" name="performance" value="35">
Good Performance (+35 XP)
</label>


<label>
<input type="radio" name="performance" value="20">
Practice Attempt (+20 XP)
</label>





<h3>🔁 Song Repetition</h3>


<label>
<input type="radio" name="repetition" value="50">
Low Repetition (+50 XP)
</label>


<label>
<input type="radio" name="repetition" value="25">
Medium Repetition (+25 XP)
</label>


<label>
<input type="radio" name="repetition" value="10">
High Repetition (+10 XP)
</label>





<h3>🎯 Difficulty</h3>


<label>
<input type="radio" name="difficulty" value="1">
Easy ×1
</label>


<label>
<input type="radio" name="difficulty" value="1.5">
Medium ×1.5
</label>


<label>
<input type="radio" name="difficulty" value="2">
Hard ×2
</label>


<label>
<input type="radio" name="difficulty" value="3">
Master ×3
</label>





<h3>🏆 Bonuses</h3>


<label>
<input type="checkbox" class="bonus" value="100">
New Song Learned (+100 XP)
</label>


<label>
<input type="checkbox" class="bonus" value="150">
Difficult Challenge (+150 XP)
</label>


<label>
<input type="checkbox" class="bonus" value="50">
Personal Record (+50 XP)
</label>





<h3>🎹 Technical Evaluation</h3>


<label>
<input type="radio" name="rhythm" value="10">
Perfect Rhythm (+10 XP)
</label>


<label>
<input type="radio" name="rhythm" value="-5">
Rhythm Problem (-5 XP)
</label>



<label>
<input type="radio" name="notes" value="10">
Accurate Notes (+10 XP)
</label>


<label>
<input type="radio" name="notes" value="-5">
Wrong Notes (-5 XP)
</label>



<label>
<input type="radio" name="expression" value="10">
Excellent Expression (+10 XP)
</label>


<label>
<input type="radio" name="expression" value="-5">
Needs Expression (-5 XP)
</label>






<h2>
Final XP:
<span id="final-xp">
0
</span>
XP
</h2>



<h2>
Reward:
<span id="reward">
0
</span>
 تومان
</h2>




<button id="calculate-button">

Calculate XP

</button>



<button id="save-button">

Save Performance

</button>



<p id="message"></p>


</section>



</main>



<script>

document.addEventListener(
"DOMContentLoaded",
function(){

const loginButton =
document.getElementById("login-button");


const passwordInput =
document.getElementById("password");


const loginCard =
document.getElementById("login-card");


const parentPanel =
document.getElementById("parent-panel");



loginButton.onclick = function(){


if(passwordInput.value === "1234"){


loginCard.style.display="none";


parentPanel.style.display="block";


console.log("Login successful");


}

else{

alert("Wrong password");

}


};


});


</script>
<script 
type="module"
src="./app.js?v=21">
</script>



<script>


document
.getElementById("login-button")
.addEventListener(
"click",
function(){


let password =
document.getElementById("password").value;



if(password === "1234"){


document
.getElementById("login-card")
.style.display="none";


document
.getElementById("parent-panel")
.style.display="block";


}

else{


alert("Wrong password");


}


});


</script>



</body>

</html>
