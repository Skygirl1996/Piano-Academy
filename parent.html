<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Online Piano Academy | Parent Panel</title>

    <link
        rel="stylesheet"
        href="./style.css?v=6"
    >
</head>


<body>

    <div class="music-notes">
        ♪ ♫ ♬ ♪ ♫
    </div>


    <main class="container">

        <header class="academy-header">
            <div class="piano-icon">🎹</div>

            <h1>Online Piano Academy</h1>

            <p>Parent Performance Review</p>
        </header>


        <section
            id="login-card"
            class="card login-card"
        >
            <div class="card-icon">🔐</div>

            <h2>Parent Login</h2>

            <p>
                Enter the parent password to review
                Kiamahr's performance.
            </p>

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter password"
            >

            <button
                id="login-button"
                type="button"
                class="primary-button"
            >
                Unlock Parent Panel
            </button>
        </section>


        <section
            id="parent-panel"
            class="card parent-panel"
            hidden
        >
            <div class="card-icon">🎧</div>

            <h2>Review Kiamahr's Performance</h2>

            <p class="panel-description">
                Select the current evaluation stage.
                The academy page will update automatically.
            </p>


            <div class="parent-actions">

                <button
                    id="listening-button"
                    type="button"
                    class="status-button listening-button"
                >
                    <span>🎧</span>

                    <strong>Listening</strong>

                    <small>
                        We are listening to the performance
                    </small>
                </button>


                <button
                    id="reviewing-button"
                    type="button"
                    class="status-button reviewing-button"
                >
                    <span>🔍</span>

                    <strong>Reviewing</strong>

                    <small>
                        Rhythm and accuracy are being checked
                    </small>
                </button>


                <button
                    id="approve-button"
                    type="button"
                    class="status-button approve-button"
                >
                    <span>🏆</span>

                    <strong>Approve Performance</strong>

                    <small>
                        Confirm performance and award 50 XP
                    </small>
                </button>

            </div>


            <p
                id="admin-message"
                class="admin-message"
                aria-live="polite"
            ></p>

        </section>

    </main>


    <script
        type="module"
        src="./app.js?v=6"
    ></script>

</body>

</html>
